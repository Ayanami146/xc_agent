# 参考实现，尚未自动接入当前项目。
services:
  mongodb:
    # 固定小版本，避免使用 latest 导致重建容器时发生不可预期升级。
    image: mongo:8.0.29-noble
    container_name: xc-agent-mongodb
    restart: unless-stopped
    environment:
      # root 账号只用于初始化和运维，Python Agent 禁止使用该账号连接。
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: xinchuang_agent_context
      # 以下变量由 /docker-entrypoint-initdb.d 中的脚本读取，用于创建最小权限应用账号。
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      # 只绑定虚拟机内网地址。还应在虚拟机防火墙中限制为开发电脑来源地址。
      - "${MONGO_BIND_IP:-192.168.100.128}:27017:27017"
    volumes:
      # 命名卷保存数据库文件，删除容器不会删除数据卷。
      - agent_context_mongodb_data:/data/db
      # 初始化脚本只在数据卷首次为空时运行，并以只读方式挂载。
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 使用容器内 root 初始化账号执行 ping；$${VAR} 用于阻止 Compose 提前展开变量。
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  # 显式命名，便于备份、迁移和人工识别。
  agent_context_mongodb_data:
    name: xc_agent_context_mongodb_data
