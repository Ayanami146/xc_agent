openapi: 3.1.0
info:
  title: 信创智能客服管理端 API
  version: 1.0.0
  description: 独立管理端使用的认证、工单、内容和审计接口。
servers:
  - url: /api/v1/admin
security:
  - adminBearer: []
tags:
  - name: AdminAuth
  - name: Dashboard
  - name: Tickets
  - name: Content
  - name: Audit
paths:
  /auth/login:
    post:
      tags: [AdminAuth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminLogin'}
      responses:
        '200': {$ref: '#/components/responses/AdminSession'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      tags: [AdminAuth]
      security: [{adminRefresh: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminSession'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [AdminAuth]
      security: [{adminRefresh: []}]
      responses:
        '204': {description: 已注销并清除 Cookie}
  /dashboard/overview:
    get:
      tags: [Dashboard]
      responses:
        '200': {description: 用户、会话、工单和内容统计}
  /admins:
    get:
      tags: [Dashboard]
      description: ADMIN 专用的只读管理员分页列表。
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: role, in: query, schema: {type: string, enum: [ADMIN, SUPPORT]}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, DISABLED, LOCKED]}}
      responses:
        '200': {description: 管理员分页}
        '403': {$ref: '#/components/responses/Problem'}
  /tickets:
    get:
      tags: [Tickets]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: assigneeId, in: query, schema: {type: string}}
      responses:
        '200': {description: 工单分页}
  /tickets/{id}:
    get:
      tags: [Tickets]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: 工单详情、回复、附件和时间线}
        '404': {$ref: '#/components/responses/Problem'}
  /tickets/{id}/assign:
    post:
      tags: [Tickets]
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [assigneeId], properties: {assigneeId: {type: string}}}}}
      responses:
        '200': {description: 已分配的工单详情}
        '409': {$ref: '#/components/responses/Problem'}
  /tickets/{id}/replies:
    post:
      tags: [Tickets]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [content], properties: {content: {type: string, maxLength: 2000}}}}}
      responses:
        '200': {description: 已追加回复的工单详情}
  /tickets/{id}/transitions:
    post:
      tags: [Tickets]
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [targetStatus, reason], properties: {targetStatus: {type: string}, reason: {type: string}}}}}
      responses:
        '200': {description: 流转后的工单详情}
        '409': {$ref: '#/components/responses/Problem'}
  /faq-categories:
    get: {tags: [Content], responses: {'200': {description: FAQ 分类}}}
    post:
      tags: [Content]
      description: ADMIN 专用。
      requestBody: {$ref: '#/components/requestBodies/Category'}
      responses: {'200': {description: 新分类}, '403': {$ref: '#/components/responses/Problem'}}
  /faqs:
    get: {tags: [Content], responses: {'200': {description: FAQ 分页}}}
    post:
      tags: [Content]
      description: ADMIN 专用，创建 DRAFT。
      responses: {'200': {description: FAQ 草稿}}
  /manual-categories:
    get: {tags: [Content], responses: {'200': {description: 手册分类}}}
    post:
      tags: [Content]
      requestBody: {$ref: '#/components/requestBodies/Category'}
      responses: {'200': {description: 新分类}}
  /manuals:
    get: {tags: [Content], responses: {'200': {description: 手册分页}}}
    post:
      tags: [Content]
      description: ADMIN 专用，上传最大 20 MB 的 PDF、DOC、DOCX、TXT 或 MD。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [categoryId, title, file]
              properties:
                categoryId: {type: string}
                title: {type: string}
                summary: {type: string}
                file: {type: string, format: binary}
      responses:
        '200': {description: 新手册草稿}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
  /audits:
    get:
      tags: [Audit]
      description: ADMIN 专用操作审计分页。
      responses:
        '200': {description: 审计分页}
        '403': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    adminBearer: {type: http, scheme: bearer, bearerFormat: JWT}
    adminRefresh: {type: apiKey, in: cookie, name: XC_ADMIN_REFRESH_TOKEN}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: 当前资源 version}
  requestBodies:
    Category:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CategorySave'}
  schemas:
    AdminLogin:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account: {type: string, minLength: 1}
        password: {type: string, minLength: 1}
    AdminSessionData:
      type: object
      required: [accessToken, expiresAt, adminId, displayName, role, permissions]
      properties:
        accessToken: {type: string}
        expiresAt: {type: string, format: date-time}
        adminId: {type: string}
        displayName: {type: string}
        role: {type: string, enum: [ADMIN, SUPPORT]}
        permissions: {type: array, items: {type: string}}
    CategorySave:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 100}
        sortOrder: {type: integer}
        status: {type: string, enum: [ENABLED, DISABLED]}
    Problem:
      type: object
      properties:
        status: {type: integer}
        code: {type: string}
        title: {type: string}
        detail: {type: string}
        requestId: {type: string}
  responses:
    AdminSession:
      description: 登录会话，同时设置 XC_ADMIN_REFRESH_TOKEN Cookie。
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId: {type: string}
              data: {$ref: '#/components/schemas/AdminSessionData'}
    Problem:
      description: 统一错误响应
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
