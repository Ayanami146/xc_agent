[project]
name = "xinchuang-agent-service"
version = "0.1.0"
description = "信创智能客服的独立 Python 智能体服务"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-chroma>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langgraph>=1.1.0,<2.0.0",
    "langgraph-checkpoint-redis>=0.5,<0.6",
    "langgraph-store-mongodb>=0.3,<0.4",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pymongo>=4.14,<5",
    "pypdf>=5.0.0,<7.0.0",
    "docx2txt>=0.9,<1.0",
    "redis>=6.4,<9",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
agent-service = "agent_service.cli:main"
agent-context-consumer = "agent_service.consumer_main:run"


[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache-plan", ".venv", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 项目要求提供完整中文注释，中文全角标点是有意使用，不按歧义字符处理。
ignore = ["RUF001", "RUF002", "RUF003"]
