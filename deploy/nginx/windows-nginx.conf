# Windows 本机练习配置
# 使用方式：复制为 C:/tools/nginx/conf/nginx.conf

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    upstream xinchuang_backend {
        # 如果你的后端端口不同，只修改这一行。
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen       8088;
        server_name  localhost;

        # Windows 路径在 Nginx 中使用正斜杠。
        root   C:/work_learn/XinChuang_pc/frontend/dist;
        index  index.html;
        client_max_body_size 21m;

        # 独立管理端构建产物，访问地址：http://localhost:8088/admin/
        location = /admin {
            return 301 /admin/;
        }

        location ^~ /admin/assets/ {
            alias C:/work_learn/XinChuang_pc/admin-frontend/dist/assets/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location = /admin/index.html {
            alias C:/work_learn/XinChuang_pc/admin-frontend/dist/index.html;
            add_header Cache-Control "no-cache,no-store,must-revalidate";
        }

        location /admin/ {
            alias C:/work_learn/XinChuang_pc/admin-frontend/dist/;
            try_files $uri $uri/ /admin/index.html;
        }

        # POST SSE：必须关闭代理缓冲，否则回答可能最后一次性显示。
        location = /api/v1/chat/stream {
            proxy_pass http://xinchuang_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 130s;
            proxy_send_timeout 130s;
            gzip off;
            add_header X-Accel-Buffering no;
        }

        # 其他后端接口。
        location /api/ {
            proxy_pass http://xinchuang_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
        }

        # Vue Router history 模式刷新回退。
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的构建资源可以长期缓存。
        location /assets/ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
