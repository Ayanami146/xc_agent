# 将 support.example.com、证书路径和 upstream 地址替换为实际值。
upstream xinchuang_business_api {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name support.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name support.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    root /srv/xinchuang/frontend/current;
    index index.html;
    charset utf-8;
    client_max_body_size 52m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(),geolocation=(),payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        alias /srv/xinchuang/admin-frontend/current/assets/;
        expires 1y;
        add_header Cache-Control "public,max-age=31536000,immutable";
    }

    location = /admin/index.html {
        alias /srv/xinchuang/admin-frontend/current/index.html;
        add_header Cache-Control "no-cache,no-store,must-revalidate";
    }

    location /admin/ {
        alias /srv/xinchuang/admin-frontend/current/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /api/v1/chat/stream {
        proxy_pass http://xinchuang_business_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Key-Id "";
        proxy_set_header X-Internal-Timestamp "";
        proxy_set_header X-Internal-Nonce "";
        proxy_set_header X-Internal-Signature "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location ^~ /api/ {
        proxy_pass http://xinchuang_business_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Key-Id "";
        proxy_set_header X-Internal-Timestamp "";
        proxy_set_header X-Internal-Nonce "";
        proxy_set_header X-Internal-Signature "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public,max-age=31536000,immutable";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache,no-store,must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
